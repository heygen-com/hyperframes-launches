    <script>
      /* ================= deterministic PRNG ================= */
      function mulberry32(a) {

        // leading/2 + fbAsc where leading = 1 - (fbAsc+fbDesc)
        const baseInBox = fs * ((1 - (capM.fbAsc + capM.fbDesc)) / 2 + capM.fbAsc);
        const baselineY = capTop + capH;
        el.style.top = (baselineY - baseInBox) + "px";
        if (opts.left !== undefined) el.style.left = opts.left + "px";
        if (opts.ls !== undefined) el.style.letterSpacing = opts.ls + "px";

        }
        for (let x = 564; x <= 1410; x += 94) { put(x, 94, 0, 1); put(x, 940, 0, 1); }
        for (let y = 188; y <= 846; y += 94) { put(564, y, 1, 0); put(1410, y, 1, 0); }
        [[658, 188], [1316, 188], [658, 846], [1316, 846],
         [470, 470], [1504, 376], [470, 752], [1504, 658]].forEach(function (p) { cells.push(p); });
        return cells;
      })();
      // texture-state CSS per palette (flurry states cycle through these);
      // "whiteCap" caps fills at ~luma 165 — ref caps texture brightness
      // outside the n50-60 entry pulse (events at t >= 2.2 use it)
      function pinBG(c) {
        return "linear-gradient(" + c + "," + c + ") 0 0/50% 50% no-repeat, " +
               "linear-gradient(" + c + "," + c + ") 100% 100%/50% 50% no-repeat";
      }
      const BLK_BG = {
        white: { solid: "#dfdfdd", scan: SCAN, hatch: HATCH, pin: pinBG("#dfdfdd") },
        whiteCap: {
          solid: "#a5a5a2",
          scan: "repeating-linear-gradient(0deg, #a5a5a2 0 3px, rgba(165,165,162,0.38) 3px 6px)",

          scan: "repeating-linear-gradient(0deg, #a586cc 0 3px, rgba(165,134,204,0.35) 3px 6px)",
          hatch: "repeating-linear-gradient(45deg, #9d78c8 0 2px, transparent 2px 9px)",
          pin: pinBG("#9d78c8"),

      };
      const fieldW = buildField("asquares", false, 4242);
      const fieldP = buildField("asquaresp", true, 4242);

      // birth times: squares from top-right first (0.78), rest 0.95-1.45
      const rB = mulberry32(777);
      const births = [];
      fieldW.born.forEach(function (pair, i) {
        const d = pair[0];
        const x = parseFloat(d.style.left), y = parseFloat(d.style.top);
        const nearTR = (x > 1000 && y < 500);
        const t = pair[1] === "early"
          ? (nearTR ? range(0.78, 0.95, rB) : range(0.95, 1.45, rB))

      });
      // clockwise ring ignition schedule (measured: two arms 180deg apart,
      // one lap ~28f; per visit a 2-4-state flurry at 1-2f steps; active
      // spurts 1.0-2.2s and 2.63-3.2s, silent afterwards)
      const rR = mulberry32(9091);
      const T_REV = 0.9333;
      const SPURTS = [[1.0, 2.2], [2.633, 3.2]];
      // no glitch/dot-matrix state: class absent in ref scene A (swapped for
      // pinwheel); scanline-fill concurrency <= 2: hold states favor hatch
      const KINDS_MID = ["solid", "pin", "outline", "solid", "scan", "hatch"];
      const KINDS_HOLD = ["hatch", "hatch", "outline", "solid", "pin", "hatch"];
      const ringSched = RING_CELLS.map(function (rc) {
        const cx = rc[0] + 47, cy = rc[1] + 47;
        let prog = Math.atan2(cy - 540, cx - 960) / (2 * Math.PI);
        prog = (prog + 1) % 1;                     // 0..1 clockwise
        const ev = [];
        // birth: ~half the cells hold a texture before the sweep starts
        // (entry pulse n50-60 is the bright peak of the ref envelope)
        ev.push([0.9 + rR() * 0.6, rR() < 0.5 ? "empty" : pick(KINDS_HOLD, rR), 0.55 + rR() * 0.45]);
        const passes = [];
        for (let m = 0; m < 10; m++) {
          const tp = 0.62 + (prog + m * 0.5) * T_REV;
          if (SPURTS.some(function (s) { return tp >= s[0] && tp <= s[1]; })) passes.push(tp);
        }
        passes.forEach(function (tp, pi) {
          if (rR() < 0.35 && pi !== passes.length - 1) return;   // arm skips some cells
          let t = tp + rR() * 0.04;
          const nCh = 2 + Math.floor(rR() * 3);
          for (let k2 = 0; k2 < nCh; k2++) {
            const last = k2 === nCh - 1;
            let kind;
            if (last) {
              const lastPass = pi === passes.length - 1;
              kind = rR() < (lastPass ? 0.55 : 0.72) ? "empty" : pick(KINDS_HOLD, rR);
            } else {
              kind = pick(KINDS_MID, rR);
            }
            ev.push([t, kind, 0.55 + rR() * 0.45]);
            t += 0.0333 * (1 + Math.floor(rR() * 2));
          }
        });
        ev.sort(function (a2, b2) { return a2[0] - b2[0]; });
        return ev;
      });

      /* title-box ghost lanes + marching dashes: faint "/" strokes at
         ~100px pitch; bright 13px dashes glide DOWN-LEFT along each lane
         at ~61px/s, ~11f per pass, lane cycle 14f, lanes staggered
         (measured from reference kymographs) */
      function buildLanes(hostId, purple) {
        const host = document.getElementById(hostId);
        const arr = [];

          line.style.background = purple ? "rgba(171,132,207,0.22)" : "rgba(255,255,255,0.10)";
          lane.appendChild(line);
          const ds = [];
          for (let j = 0; j < 3; j++) {
            const b = document.createElement("b");
            b.style.background = purple ? "rgba(171,132,207,0.78)" : "rgba(224,224,228,0.6)";
            lane.appendChild(b); ds.push(b);
          }
          host.appendChild(lane);
          arr.push({ l: l, dashes: ds });
        }
        return arr;
      }
      const lanesW = buildLanes("aselrect", false);
      const lanesP = buildLanes("aselrectp", true);
      function frac(v) { return v - Math.floor(v); }
      function boxDashes(t) {
        const on = t >= 1.75 && t <= 4.63;
        [lanesW, lanesP].forEach(function (set) {
          set.forEach(function (L) {
            const C = 0.4667, G = 0.3667;
            const u = (t - 1.75) / C + L.l * 0.214;
            const c = Math.floor(u), tau = frac(u) * C;
            L.dashes.forEach(function (b, j) {
              if (!on || tau > G) { b.style.opacity = "0"; return; }
              const h = mulberry32((L.l * 131) ^ (c * 7919) ^ 0x77)();
              const y0 = 20 + h * 60 + j * 95;
              const a = Math.min(1, tau / 0.0667, (G - tau) / 0.1);
              b.style.opacity = a.toFixed(3);
              b.style.transform = "translateY(" + (y0 + 61.5 * tau).toFixed(1) + "px)";
            });
          });
        });
      }

      /* scene-A title placement happens in calibrateType() */
      makeStrip("stripAL", 157, 530, 139, 15, 19);
      makeStrip("stripAR", 1626, 530, 139, 15, 19);

      /* scene A pills — continuous clockwise orbit around the title
         (measured: center (985,540), pentagon stations, total sweep ~+128deg
         over 1.7-4.5s, U-shaped speed: mirrored expo eases with minimum
         ~13 deg/s at t~3.25s; NO discrete relocations) */
      // K3 capabilities ride the measured JTX pill tracks 1:1
      // (longest label takes the longest measured track, ex-"Jupiter route")
      const PILLS = ["Agentic", "Delta Attention", "1M Context", "Vision", "Coding"];
      const PBIRTH = [1.483, 1.483, 1.483, 1.567, 1.633];
      // measured position keyframes (t, cx, cy) per pill (OCR track fits)
      const PILL_KF = [
        [[1.70, 570, 367], [2.30, 817, 154], [3.00, 946, 139], [4.00, 1089, 171], [4.50, 1287, 375]],   // Agentic (ex-RFQ track)
        [[2.30, 1316, 266], [3.00, 1373, 373], [4.00, 1396, 494], [4.50, 1257, 729]],                    // Delta Attention (ex-Jupiter route)
        [[1.70, 737, 815], [2.30, 580, 547], [3.00, 585, 435], [4.00, 674, 328], [4.50, 910, 218]],      // 1M Context (ex-AMM Pool)
        [[1.70, 1172, 831], [2.30, 860, 879], [3.00, 752, 825], [4.00, 665, 737], [4.50, 594, 472]],     // Vision (ex-CLOB)
        [[2.00, 1399, 668], [2.30, 1364, 769], [3.00, 1254, 848], [4.00, 1086, 891], [4.50, 769, 832]],  // Coding (ex-propAMM)
      ];
      // scene-B stack slot centers (flight targets on exit; ref waterfall)
      const PILL_EXIT_Y = [884, 428, 655, 768, 541];
      const ORB_CX = 985, ORB_CY = 540;
      // shared angular sweep (deg, cumulative from t=1.70):
      // omega(t) = 139.9*exp(-(t-1.7)/0.3906)+10.1 deg/s arriving (halving
      // ~0.33s), mirrored expo departing from the t=3.25 minimum
      function orbTheta(t) {
        if (t <= 3.25) return 54.65 * (1 - Math.exp(-(t - 1.7) / 0.3906)) + 10.1 * (t - 1.7);
        return 69.27 + 0.7934 * (Math.exp((t - 3.25) / 0.3005) - 1) + 10.56 * (t - 3.25);
      }
      // convert keyframes to (t, angleDeg unwrapped clockwise-from-12, radius)
      const pillTracks = PILL_KF.map(function (kfs) {
        let prev = null;
        return kfs.map(function (k) {
          let a = Math.atan2(k[1] - ORB_CX, ORB_CY - k[2]) * 180 / Math.PI;
          if (a < 0) a += 360;
          if (prev !== null) { while (a < prev) a += 360; }
          prev = a;
          const dx = k[1] - ORB_CX, dy = k[2] - ORB_CY;
          return [k[0], a, Math.sqrt(dx * dx + dy * dy)];
        });
      });
      const apills = document.getElementById("apills");
      const pillEls = PILLS.map(function (label) {
        const p = document.createElement("div");
        p.className = "pill";
        p.innerHTML = label + '<div class="hstrip"><div></div></div>';
        p.style.left = "0px"; p.style.top = "0px";
        p.style.transformOrigin = "50% 50%";
        apills.appendChild(p);
        return p;
      });
      const pillDims = pillEls.map(function () { return [140, 48]; });
      function measurePills() {
        pillEls.forEach(function (p, i) {
          pillDims[i] = [p.offsetWidth || 140, p.offsetHeight || 48];
        });
      }
      function orbitPills(t) {
        if (t < 1.4 || t > 4.6) return;
        const th = orbTheta(t);
        const f = Math.floor(t * 30 + 1e-4);
        pillEls.forEach(function (p, i) {
          if (t < PBIRTH[i] - 0.001) return;
          const trk = pillTracks[i];
          let a, r;
          if (t <= trk[0][0]) {                       // pre-first-keyframe: same law
            a = trk[0][1] - (orbTheta(trk[0][0]) - th);
            r = trk[0][2];
          } else if (t >= trk[trk.length - 1][0]) {   // post-last: continue law + radius drift
            const kl = trk[trk.length - 1], kp = trk[trk.length - 2];
            const dth = orbTheta(kl[0]) - orbTheta(kp[0]);
            a = kl[1] + (th - orbTheta(kl[0]));
            r = kl[2] + (kl[2] - kp[2]) * (th - orbTheta(kl[0])) / dth;
          } else {
            let k = 0;
            while (trk[k + 1][0] < t) k++;
            const t0 = orbTheta(trk[k][0]), t1 = orbTheta(trk[k + 1][0]);
            const w = (th - t0) / (t1 - t0);
            a = trk[k][1] + (trk[k + 1][1] - trk[k][1]) * w;
            r = trk[k][2] + (trk[k + 1][2] - trk[k][2]) * w;
          }
          const rad = a * Math.PI / 180;
          let cx = ORB_CX + r * Math.sin(rad);
          let cy = ORB_CY - r * Math.cos(rad);
          // 1-frame jolt at exactly v90 (3.00s): +9px along travel direction
          if (f === 90) { cx += 9 * Math.cos(rad); cy += 9 * Math.sin(rad); }
          // exit flight from 4.53s: break orbit, accelerate toward the B stack
          if (t > 4.53) {
            const u = t - 4.53;
            const tx = 500 - cx, ty = PILL_EXIT_Y[i] - cy;
            const dn = Math.max(1, Math.sqrt(tx * tx + ty * ty));
            const D = 18000 * u * u;
            cx += tx / dn * D; cy += ty / dn * D;
          }
          // scale: in 79%->100% over 0.4s from birth, then -3.2%/s shrink from 2.0s
          const eIn = clamp((t - PBIRTH[i]) / 0.4, 0, 1);
          const s = (0.79 + 0.21 * (1 - Math.pow(1 - eIn, 2))) * (1 - 0.08 * clamp((t - 2.0) / 2.5, 0, 1));
          p.style.left = (cx - pillDims[i][0] / 2).toFixed(1) + "px";
          p.style.top = (cy - pillDims[i][1] / 2).toFixed(1) + "px";
          p.style.transform = "scale(" + s.toFixed(4) + ")";
        });
      }

      /* ================= ghost columns ================= */
      const ghost = document.getElementById("ghostinner");
      for (let c = 0; c < 42; c++) {
        const colEl = document.createElement("div");
        colEl.className = "gcol";
        colEl.style.left = (c * 46) + "px";
        colEl.style.opacity = String(range(0.3, 1));

      /* ================= scene B stack =================
         (ref landing: 113px pitch, centers y 428/541/655/768/884) */

      const STACK_TOPS = [0, 113, 227, 340, 456];

      /* ================= scene C bars (16 accent + 2 teal at the bottom) ===== */
      // Kimi accent (single knob): DECODE bars shift from the JTX red family

      const KIMI_BAR = { brightL: "#3f74bf", brightR: "#102a52", dimL: "#254a7e", dimR: "#0a1830" };
      const cbars = document.getElementById("cbars");

      makeQmarks("cqmarks", [[310, 275, -1, -1], [1490, 275, 1, -1], [310, 805, -1, 1], [1490, 805, 1, 1]]);

      /* ============ scene D+E traveling pin waves (measured) ============
         D bottom wave: T=39f (1.30s), lambda≈2250px, crest travels LEFT
         at ~58px/f (direct crest tracking f243-f273: x1803 -> x75);
         pins pitch ~71px, stem 226px, pivot ~y1085; stem height AND lean
         undulate — flat (~87deg) near troughs, tall upright at crests.
         E ticker row: same grammar at T=43f (1.433s); two-dot pins,
         pitch ~41px, pivot on the bottom dot, full flat sweeps, no
         height modulation. Both rows are one linked ripple: per-pin
         phase = k*x. */
      const rP = mulberry32(6060);
      const dpinHost = document.getElementById("dpins");
      const dpins = [];
      for (let i = 0; i < 28; i++) {
        const x = -34 + i * 71 + range(-4, 4, rP);
        const p = document.createElement("div");
        p.className = "pin";
        p.innerHTML = '<div class="stem"></div><div class="head"></div>';
        p.style.left = x + "px";
        p.style.bottom = "-5px";
        dpinHost.appendChild(p);
        dpins.push({ el: p, stem: p.querySelector(".stem"), head: p.querySelector(".head"),
                     x: x + 15, jit: range(-0.12, 0.12, rP) });
      }
      /* scene E helix row (measured): ~73 pins, dx 26.3px, axis y=534,
         each pin a 168px chord of a corkscrew rotating about the x-axis:
         phi(x,t) = 2.405*t + 0.00343*x + C (phi = 1.33 + 0.00343x at t=9.6s);
         CSS rotateX(phi - 90deg) under perspective 4100px at screen center
         reproduces both the endpoint schedule (half-height 84*|sin phi|) and
         the lean law dx(bottom-top) = -0.040*(x-960)*cos(phi). */
      const epinHost = document.getElementById("epins");
      const hpins = [];
      for (let i = 0; i < 73; i++) {
        const x = 5 + i * 26.3;
        const g = document.createElement("div");
        g.className = "hpin";
        g.innerHTML = '<div class="rod"></div><div class="da"></div><div class="db"></div>';
        g.style.left = (x - 6) + "px";
        epinHost.appendChild(g);
        hpins.push({ el: g, rod: g.querySelector(".rod"), x: x, near: null });
      }
      const HX_C = 1.33 - 2.405 * 9.6;   // phase constant
      function helixPins(t) {
        if (t < 8.85 || t > 11.35) return;
        for (let i = 0; i < hpins.length; i++) {
          const p = hpins[i];
          const phi = 2.405 * t + 0.00343 * p.x + HX_C;
          const th = (phi - Math.PI / 2) * 57.29578;
          p.el.style.transform = "rotateX(" + th.toFixed(2) + "deg)";
          const near = Math.cos(phi) > 0;
          if (near !== p.near) {   // near-side shading: rod luma +~10%
            p.near = near;
            p.rod.style.background = near ? "#515152" : "#454546";
          }
        }
      }
      const WAVE_K = 2 * Math.PI / 2250;
      function waveSide(u, x) {
        // which way a pin group falls this cycle: spatially coherent,
        // varies per cycle, flips only at crests (lean==0) so it is smooth
        const cyc = Math.floor((u - Math.PI / 2) / (2 * Math.PI));
        return Math.sin(cyc * 2.4 + x * 0.00185 + 0.9) >= 0 ? 1 : -1;
      }
      function wavePins(t) {
        if (t >= 7.34 && t <= 9.5) {
          const w = 2 * Math.PI / 1.30;
          // ref entry: pins rise near-uniformly first, then the traveling
          // modulation fades in (~7.6-8.1s)
          const e = clamp((t - 7.36) / 0.4, 0, 1);
          const rise = 1 - Math.pow(1 - e, 2);
          const mEnv = clamp((t - 7.58) / 0.5, 0, 1);
          dpins.forEach(function (p) {
            const u = w * (t - 7.35) + WAVE_K * p.x - 0.79 + p.jit;
            const h = 0.5 + 0.5 * Math.sin(u);
            const hEff = 1 + (h - 1) * mEnv;
            const s = (0.16 + 0.84 * Math.pow(hEff, 0.75)) * (0.10 + 0.90 * rise);
            const lean = waveSide(u, p.x) * 87 * Math.pow(1 - hEff, 1.15) * Math.pow(mEnv, 1.3);
            p.el.style.transform = "rotate(" + lean.toFixed(2) + "deg)";
            p.stem.style.transform = "scaleY(" + s.toFixed(4) + ")";
            p.head.style.transform = "translateY(" + (226 * (1 - s)).toFixed(1) + "px)";
          });
        }
      }

      /* box hatch glide (measured): pattern translates +x continuously.
         D box (local px/frame): v = 10 + 30*exp(-(f-229)/7) for f 229-263,
         0 for f 263-285; then the E-window shared schedule
         v_screen = 4.4 - 0.045*(f-285) resumes (local = screen/0.493 once
         the box has morphed to E-box2 scale). box1 shares that schedule;
         box3 runs -6*exp(-(f-286)/6) until f299 then +1.9 px/f decaying. */
      const ohatchEl = document.getElementById("ohatchwrap");
      const mhatchEl = document.getElementById("mktgrp").querySelector(".bhatch");
      const ahatchEl = document.getElementById("astgrp").querySelector(".bhatch");
      function hatchGlide(t) {
        if (t < 7.3 || t > 11.3) return;
        const f = t * 30;
        let X;
        if (f <= 229) X = 0;
        else if (f <= 263) X = 10 * (f - 229) + 210 * (1 - Math.exp(-(f - 229) / 7));
        else if (f < 285) X = 548.4;
        else { const u = Math.min(f - 285, 97.8); X = 548.4 + (4.4 * u - 0.0225 * u * u) / 0.493; }
        ohatchEl.style.backgroundPosition = X.toFixed(2) + "px 0px";
        let Xm = 0;
        if (f >= 285) { const u = Math.min(f - 285, 97.8); Xm = 4.4 * u - 0.0225 * u * u; }
        mhatchEl.style.backgroundPosition = Xm.toFixed(2) + "px 0px";
        let Xa = 0;
        if (f >= 286) {
          if (f <= 299) Xa = -36 * (1 - Math.exp(-(f - 286) / 6));
          else { const u = Math.min(f - 300, 95); Xa = -31.88 + 1.9 * u - 0.01 * u * u; }
        }
        ahatchEl.style.backgroundPosition = Xa.toFixed(2) + "px 0px";
      }

      /* D text: per-character spans so the wide->tight tracking settle can be
         animated with per-glyph x transforms (lint-clean, sub-pixel). */
      const oChars = [];
      (function () {
        const w1 = document.getElementById("ow1"), w2 = document.getElementById("ow2");
        "Every".split("").forEach(function (c) {
          const s = document.createElement("span");
          s.style.display = "inline-block";
          s.textContent = c;
          w1.appendChild(s); oChars.push(s);
        });
        " modality".split("").forEach(function (c) {
          const s = document.createElement("span");
          s.style.display = "inline-block";
          if (c === " ") { s.innerHTML = "&nbsp;"; } else { s.textContent = c; }
          w2.appendChild(s); oChars.push(s);
        });
      })();

      /* furniture D/E */
      makeStrip("stripDL", 75, 533, 125, 15, 19);
      makeStrip("stripDR", 1700, 533, 125, 15, 19);
      makeQmarks("deqmarks", [[205, 215, -1, -1], [1720, 215, 1, -1], [205, 870, -1, 1], [1720, 870, 1, 1]]);
      makePlusses("deqmarks", [[75, 100], [1845, 100], [75, 970], [1845, 970]], 25, 0.5);

      /* ================= scene F/G card ================= */
      const FGB_H = 119, FGB_TOP = 480;
      const fgbl = document.getElementById("fgbl"), fgbr = document.getElementById("fgbr");
      const CARD_CAP = 108, CARD_TOP = 478;
      /* measured JTX card geometry: F run 566..1351 ("One"=246, gap 46,

      /* ================= K3 wordmark lockup =================
         Official Kimi icon (vector via media-use resolve, svgl kimi-icon —

      const WM_ICON = [
        // rounded-square plate
        "M503 114.333v280c0 60.711-49.29 110-110 110H113c-60.711 0-110-49.289-110-110v-280c0-60.71 49.289-110 110-110h280c60.71 0 110 49.29 110 110z",
        // accent dot
        "M342.065 189.759c1.886-2.42 3.541-4.63 5.289-6.77.81-1.007.74-1.771-.046-2.824-7.58-9.965-8.298-21.028-3.935-32.254 3.275-8.448 10.52-12.406 19.373-13.25 5.52-.521 10.936.046 15.959 2.73 6.596 3.53 10.438 8.912 11.688 16.341.995 5.926.81 11.712-.868 17.452-2.974 10.161-10.277 15.427-20.287 16.758-8.31 1.11-16.734 1.25-25.113 1.817-.648.046-1.308 0-2.06 0z",
        // K glyph (knockout)
        "M321.512 144.254h-50.064l-39.637 90.384h-56.036v-89.99H131v232.868h44.787v-98.103h78.973c13.598 0 26.015-7.927 31.744-20.252v118.355h44.787v-98.103c0-23.342-18.239-42.97-41.523-44.671v-.116h-24.593a45.577 45.577 0 0026.884-24.534l29.453-65.838z",

      document.getElementById("iglow3").innerHTML = wmMark("#ffffff", "#ffffff", "#4d9dff");

      /* ============ H canvas: scramble dissolve (measured mechanism) ============
         Glyph strokes dilated ~8-16px with a probabilistic soft edge, filled
         with dense 1-2px scanline-textured noise (vertical period ~3px);
         stroke cores saturate to white; noise field is temporally coherent
         (evolves over ~7 frames, not re-seeded); plus an additive grainy
         glow band fixed at y=540 (FWHM 35px, x ~240-1686). All pure
         functions of the frame index — deterministic and seek-safe. */
      const CV = document.getElementById("hcanvas");
      const cvx = CV.getContext("2d");
      // offscreen raster of the card lockup (font-dependent, rebuilt on font load)
      const off = document.createElement("canvas");
      off.width = 1920;off.height = 1080;
      const ox = off.getContext("2d");
      const DIS = { X0: 232, Y0: 430, W: 1460, H: 222, mask: null, dist: null };
      function rebuildDissolveField() {
        ox.clearRect(0, 0, 1920, 1080);
        ox.fillStyle = "#fff";
        const fsT = CARD_CAP / capM.capAsc;
        ox.textBaseline = "alphabetic";
        const base = CARD_TOP + CARD_CAP;
        (G_RASTER || []).forEach(function (w) {
          ox.save();
          ox.font = "400 " + fsT + "px " + FAM;
          if (ox.letterSpacing !== undefined) ox.letterSpacing = "-2.5px";
          const nat = ox.measureText(w[0]).width;
          ox.translate(w[1], 0);
          ox.scale(w[2] / nat, 1);
          ox.fillText(w[0], 0, base);
          ox.restore();
        });
        const total = braceM.capAsc + braceM.desc;
        const fsB = FGB_H / total;
        ox.font = "300 " + fsB + "px " + FAM;
        const bBase = FGB_TOP + fsB * braceM.capAsc;
        const mL = ox.measureText("{");
        ox.fillText("{", 400 + mL.actualBoundingBoxLeft, bBase);
        const mR = ox.measureText("}");
        ox.fillText("}", 1469 + mR.actualBoundingBoxLeft, bBase);
        // region mask + chamfer distance transform (3-4, i.e. px*3)
        const img = ox.getImageData(DIS.X0, DIS.Y0, DIS.W, DIS.H);
        const W = DIS.W, H = DIS.H, n = W * H;
        const mask = new Uint8Array(n);
        const dist = new Int16Array(n);
        for (let i = 0; i < n; i++) {
          mask[i] = img.data[i * 4 + 3];
          dist[i] = mask[i] > 120 ? 0 : 3000;
        }
        for (let y = 0; y < H; y++) {
          for (let x = 0; x < W; x++) {
            const i = y * W + x;
            let d = dist[i];
            if (x > 0 && dist[i - 1] + 3 < d) d = dist[i - 1] + 3;
            if (y > 0) {
              if (dist[i - W] + 3 < d) d = dist[i - W] + 3;
              if (x > 0 && dist[i - W - 1] + 4 < d) d = dist[i - W - 1] + 4;
              if (x < W - 1 && dist[i - W + 1] + 4 < d) d = dist[i - W + 1] + 4;
            }
            dist[i] = d;
          }
        }
        for (let y = H - 1; y >= 0; y--) {
          for (let x = W - 1; x >= 0; x--) {
            const i = y * W + x;
            let d = dist[i];
            if (x < W - 1 && dist[i + 1] + 3 < d) d = dist[i + 1] + 3;
            if (y < H - 1) {
              if (dist[i + W] + 3 < d) d = dist[i + W] + 3;
              if (x < W - 1 && dist[i + W + 1] + 4 < d) d = dist[i + W + 1] + 4;
              if (x > 0 && dist[i + W - 1] + 4 < d) d = dist[i + W - 1] + 4;
            }
            dist[i] = d;
          }
        }
        DIS.mask = mask; DIS.dist = dist;
      }
      // deterministic pixel hash
      function h01(a, b, c) {
        let h = Math.imul(a + 374761, 0x9E3779B1) ^ Math.imul(b + 668265, 0x85EBCA6B) ^ Math.imul(c + 951274, 0xC2B2AE35);
        h = Math.imul(h ^ (h >>> 16), 0x27D4EB2F);
        h = (h ^ (h >>> 15)) >>> 0;
        return h / 4294967296;
      }
      // lit-probability by distance band [d<1, <4, <8, <16, <24, bg] per frame
      const DIS_TAB = [
        [412, [0.97, 0.88, 0.74, 0.34, 0.06, 0.010]],
        [414, [0.97, 0.88, 0.84, 0.56, 0.19, 0.033]],
        [425, [0.94, 0.83, 0.80, 0.54, 0.21, 0.033]],
        [435, [0.87, 0.77, 0.74, 0.51, 0.23, 0.036]],
        [441, [0.83, 0.735, 0.70, 0.49, 0.24, 0.036]],
        [442, [0.76, 0.66, 0.61, 0.41, 0.19, 0.036]],
        [443, [0.60, 0.47, 0.37, 0.23, 0.10, 0.030]],
      ];
      function bandP(f) {
        if (f <= DIS_TAB[0][0]) return DIS_TAB[0][1];
        for (let i = 0; i < DIS_TAB.length - 1; i++) {
          if (f <= DIS_TAB[i + 1][0]) {
            const a = DIS_TAB[i], b = DIS_TAB[i + 1];
            const w = (f - a[0]) / (b[0] - a[0]);
            return a[1].map(function (v, j) { return v + (b[1][j] - v) * w; });
          }
        }
        return DIS_TAB[DIS_TAB.length - 1][1];
      }
      // streak envelope (appears f416, full f420-436, dead f440)
      function streakEnv(f) {
        if (f < 416 || f > 439) return 0;
        if (f < 420) return 0.42 + 0.145 * (f - 416);
        if (f <= 436) return 1;
        return f === 437 ? 0.58 : (f === 438 ? 0.33 : 0.125);
      }

      /* ============ type calibration (sync now + on webfont arrival) ============
         The renderer aliases the body font to a bundled webfont that loads
         asynchronously; all metric-derived styling is centralized here and
         re-applied when document.fonts.ready resolves, so measured geometry
         (cap heights, ink widths, brace positions) holds in the final render. */
      function calibrateType() {
        capM = inkMetrics(400, FAM, "H");
        braceM = inkMetrics(300, FAM, "{");
        // OPEN card (cap re-fit for the longer K3 headline, same 698px box)
        setBrace(obl, OB_H, OB_TOP, 511);
        setBrace(obr, OB_H, OB_TOP, 1371);
        setType(openEl, OPEN_CAP, OPEN_TOP, { left: 613, ls: -1.6 });
        fitW(openEl, 698, false);
        setType(midEl, OPEN_CAP, OPEN_TOP, { ls: -1.6 });
        setType(remEl, OPEN_CAP, OPEN_TOP, { ls: -1.6 });
        midEl.style.left = (960 - midW / 2) + "px";
        remEl.style.left = (960 - remW / 2) + "px";
        fitW(midEl, midW, false);
        fitW(remEl, remW, false);
        // scene-A title (cap 46.3 unscaled; group is at 755,444); 381/414
        // were the measured "Every Solana"/"liquidity source" ink widths —
        // keep each squeeze, re-center the K3 strings on the measured x=989
        const fsA = 46.3 / capM.capAsc;
        [["aline1", 381, 479, "Every Solana"], ["aline2", 414, 540.9, "liquidity source"],
         ["aline1p", 381, 479, "Every Solana"], ["aline2p", 414, 540.9, "liquidity source"]].forEach(function (t) {
          const el = document.getElementById(t[0]);
          setType(el, 46.3, t[2], { ls: -0.8 });
          el.style.top = (parseFloat(el.style.top) - 444) + "px";
          const W = swapW(t[1], el.textContent, t[3], fsA, -0.8);
          fitW(el, W, false);
          el.style.left = (989 - 755 - W / 2) + "px";
        });
        // B title (396 was "One book"'s measured ink width)
        fitW(document.getElementById("btitle"), swapW(396, "One model", "One book", 90, -1), false);
        // D "Every order" glyph run: font size + centered squeeze
        // (per-char inline-blocks: kerning-free, so sum char advances)
        const otxt = document.getElementById("otxt");
        const ofs = 97 / capM.capAsc;
        otxt.style.fontSize = ofs + "px";
        otxt.style.letterSpacing = "-2.5px";
        mctx.font = "400 " + ofs + "px " + FAM;
        // natRun stays summed over "Every order": 663px was that string's
        // measured ink target, so 663/natRun is the measured squeeze — the
        // longer "Every modality" rides it and widens inside the 1010px box
        let natRun = 0;
        "Every order".split("").forEach(function (c) {
          natRun += mctx.measureText(c === " " ? " " : c).width - 2.5;
        });
        otxt.style.transformOrigin = "50% 50%";
        otxt.style.transform = "scaleX(" + (663 / natRun) + ")";
        // ticker texts (395 was measured off the JTX string per box — keep
        // the squeeze, let the K3 strings set their own width)
        [["mktgrp", "Every market"], ["astgrp", "Every asset"]].forEach(function (pair) {
          const t = document.getElementById(pair[0]).querySelector(".txt");
          const fsz = 50 / capM.capAsc;
          t.style.fontSize = fsz + "px";
          mctx.font = "400 " + fsz + "px " + FAM;
          const natOld = mctx.measureText(pair[1]).width;
          t.style.transformOrigin = "50% 50%";
          t.style.transform = "scaleX(" + (395 / natOld) + ")";
        });
        // F/G card words + braces (see G_RASTER note for measured geometry)
        setBrace(fgbl, FGB_H, FGB_TOP, 400);
        setBrace(fgbr, FGB_H, FGB_TOP, 1469);
        const fsC = CARD_CAP / capM.capAsc;
        const wModel = swapW(493, "model", "platform", fsC, -2.5);
        const wK3 = swapW(260, "K3.", "JTX.", fsC, -2.5);
        const wOpen = swapW(245, "Open", "Live", fsC, -2.5);
        const fStart = 958.5 - (246 + 46 + wModel) / 2;
        const gStart = 962.5 - (wK3 + 55 + 298 + 49 + wOpen) / 2;
        G_RASTER = [["K3.", gStart, wK3], ["Now", gStart + wK3 + 55, 298],
                    ["Open", gStart + wK3 + 55 + 298 + 49, wOpen]];
        [["fw1", fStart, 246], ["fw2", fStart + 246 + 46, wModel],
         ["gw1", G_RASTER[0][1], wK3], ["gw2", G_RASTER[1][1], 298], ["gw3", G_RASTER[2][1], wOpen]
        ].forEach(function (w) {
          const el = document.getElementById(w[0]);
          setType(el, CARD_CAP, CARD_TOP, { left: w[1], ls: -2.5 });
          fitW(el, w[2], false);
        });
        // K3 wordmark type (all four glow-clone layers share the lockup)
        document.querySelectorAll(".wmk3").forEach(function (s) {
          setType(s, 78, 18.5, { left: 162, ls: -2.5 });
          fitW(s, 132, false);
        });
        // dissolve source raster + distance field follow the same metrics
        rebuildDissolveField();
        // pill boxes re-measured (orbit centers -> top/left need width/height)
        measurePills();
      }
      calibrateType();
      if (document.fonts) {
        if (document.fonts.ready) document.fonts.ready.then(function () { calibrateType(); });
        // the capture engine injects its bundled webfonts AFTER initial load;
        // re-calibrate whenever a font batch finishes loading
        document.fonts.addEventListener("loadingdone", function () { calibrateType(); });
      }

      function drawDissolve(t) {
        cvx.clearRect(0, 0, 1920, 560);
        if (t < 13.699 || t > 15.2 || !DIS.mask) return;
        const f = Math.floor(t * 30 + 1e-4);
        if (f > 455) return;
        const W = DIS.W, H = DIS.H;
        const img = cvx.createImageData(W, H);
        const px8 = img.data;
        const pB = bandP(f);
        const ep = Math.floor(f / 7), fr = (f % 7) / 7;
        const scramble = f >= 412;
        const dust = f >= 444;
        const dustBase = dust ? (f === 444 ? 0.40 : 0.32 * Math.max(0, (455 - f)) / 10) : 0;
        const sEnv = streakEnv(f);
        // streak x-extent retracts ~60px/side while dying
        const sxL = f >= 437 ? 240 + (f - 436) * 18 : 240;
        const sxR = f >= 437 ? 1686 - (f - 436) * 18 : 1686;
        for (let y = 0; y < H; y++) {
          const py = DIS.Y0 + y;
          const rb = py % 3;                       // scanline banding, period 3px
          const dyS = py - 540;
          const gY = sEnv > 0 && dyS > -46 && dyS < 46 ? Math.exp(-dyS * dyS / 441.6) : 0;
          for (let x = 0; x < W; x++) {
            const i = y * W + x;
            const pxx = DIS.X0 + x;
            const a = DIS.mask[i];
            const d = DIS.dist[i] / 3;
            let v = 0;
            if (!scramble) {
              if (a > 10) v = 214 * a / 255;       // crisp text (pre-effect)
            } else {
              const cx = (pxx / 3) | 0;            // 3x1 px noise cells (micro-streaks)
              const nz = h01(cx, py, ep) * (1 - fr) + h01(cx, py, ep + 1) * fr;
              let P;
              if (dust) {
                P = d < 24 ? dustBase * (1 - 0.28 * d / 24) : 0.03 * Math.max(0, 455 - f) / 10;
              } else {
                const bi = d < 1 ? 0 : d < 4 ? 1 : d < 8 ? 2 : d < 16 ? 3 : d < 24 ? 4 : 5;
                P = pB[bi];
                if (bi === 5 && (pxx < 402 || pxx > 1548)) P = 0;   // sprinkle only inside box
                // scanline banding: gentle on the core, strong on the fringe
                P *= bi < 2 ? (rb === 0 ? 1.1 : rb === 1 ? 1.0 : 0.8)
                            : (rb === 0 ? 1.4 : rb === 1 ? 1.05 : 0.58);
                if (P > 0.985) P = 0.985;
              }
              if (nz < P) {
                const nb = h01(cx * 3 + 911, py + 377, ep);
                v = dust ? 150 + 80 * nb
                         : (d <= 1.6 ? 255 : 128 + 96 * nb);   // cores clip white
              } else if (!dust && d <= 10) {
                v = 44 + 12 * nz;                  // pinholes lifted by bloom
              }
            }
            // additive grainy glow band at the text midline (static, y=540)
            if (gY > 0 && pxx > sxL - 8 && pxx < sxR + 8) {
              let xp = 1;
              if (pxx < sxL + 60) xp = Math.max(0, (pxx - sxL + 8) / 68);
              else if (pxx > sxR - 36) xp = Math.max(0, (sxR + 8 - pxx) / 44);
              if (xp > 0) {
                const cs = ((pxx / 3) | 0) + 4096;
                const ng = h01(cs, py, ep) * (1 - fr) + h01(cs, py, ep + 1) * fr;
                const gm = ng < 0.91 ? (0.85 + 1.15 * ng) : (3.2 + 2.2 * (ng - 0.91) / 0.09);
                v += 20 * sEnv * gY * xp * gm;
                if (v > 255) v = 255;
              }
            }
            const o = i * 4;
            if (v >= 40) {
              px8[o] = px8[o + 1] = px8[o + 2] = v | 0; px8[o + 3] = 255;
            } else if (v > 0.8) {
              px8[o] = px8[o + 1] = px8[o + 2] = 40; px8[o + 3] = (v * 6.375) | 0;
            }
          }
        }
        cvx.putImageData(img, DIS.X0, DIS.Y0 - 200);
      }

      /* ================= TIMELINE ================= */
      window.__timelines = window.__timelines || {};
      gsap.set(".sq", { x: -23, y: 66 });
      // scoped to qmarks: the C-panel "Live" label also carries .lv and must
      // stay on the measured stats row (y327 — see NOTES; replica.mp4 state)
      gsap.set(".qmark .lv", { x: -23, y: 66 });
      gsap.set(".lh", { x: -23, y: 66 });
      gsap.set(".plusm", { x: -23, y: 66 });
      const tl = gsap.timeline({ paused: true });

      /* ----- frame driver: spans whole film so any seek repaints -----
         (canvas dissolve + pin waves + helix + pill orbit + hatch glide +
         title-box dashes are all pure functions of tl.time() —
         deterministic and seek-safe) */
      const proxy = { u: 0 };
      tl.to(proxy, {
        u: 1, duration: 16.46, ease: "none",
        onUpdate: function () {
          const tt = tl.time();
          drawDissolve(tt); wavePins(tt); helixPins(tt);
          orbitPills(tt); hatchGlide(tt); boxDashes(tt);
        },
      }, 0.001);

      /* ----- OPEN card ----- */
      tl.set(["#openmid", "#openrem"], { autoAlpha: 0 }, 0);
      tl.set(["#ot1", "#ot2"], { autoAlpha: 0 }, 0);
      tl.set("#ot1", { autoAlpha: 1 }, 0.0333);
      tl.set("#ot2", { autoAlpha: 1 }, 0.0663);
      // un-type
      tl.set("#opentext", { autoAlpha: 0 }, 0.9333);
      tl.set("#openmid", { autoAlpha: 1 }, 0.9333);
      tl.set("#obl", { x: oblMidX }, 0.9333);
      tl.set("#obr", { x: obrMidX }, 0.9333);
      tl.set("#openmid", { autoAlpha: 0 }, 0.9663);
      tl.set("#openrem", { autoAlpha: 0.75 }, 0.9663);
      tl.set("#obl", { x: oblRemX }, 0.9663);
      tl.set("#obr", { x: obrRemX }, 0.9663);
      tl.to(["#obl", "#obr", "#openrem"], { autoAlpha: 0, duration: 0.07, ease: "power1.in" }, 1.0);
      tl.to("#obl", { x: oblRemX + 24, duration: 0.07 }, 1.0);
      tl.to("#obr", { x: obrRemX - 24, duration: 0.07 }, 1.0);
      tl.to(["#stripOL", "#stripOR"], { autoAlpha: 0, duration: 0.12 }, 0.95);

      /* ----- scene A ----- */
      tl.fromTo("#azoom", { scale: 1.07 }, { scale: 0.9417, duration: 3.667, ease: "none" }, 0.933);
      // field build-in
      tl.set("#alat", { opacity: 0 }, 0.75);
      tl.to("#alat", { opacity: 1, duration: 0.4, ease: "power1.inOut" }, 1.0);
      tl.set("#alatp", { opacity: 1 }, 0.75);
      // field-energy envelope (measured, field only — labels/title stay 1.0):
      // 1.0 (n<=60) -> 0.35 @n72 -> 0.60 @n84 -> linear decay to 0.08 @n127
      tl.set(["#afield", "#afieldp"], { opacity: 1 }, 0.75);
      tl.to(["#afield", "#afieldp"], { opacity: 0.35, duration: 0.4333, ease: "power1.inOut" }, 1.9667);
      tl.to(["#afield", "#afieldp"], { opacity: 0.60, duration: 0.4, ease: "power1.inOut" }, 2.4);
      tl.to(["#afield", "#afieldp"], { opacity: 0.08, duration: 1.4333, ease: "none" }, 2.8);
      tl.to(["#afield", "#afieldp"], { opacity: 0.02, duration: 0.3, ease: "none" }, 4.2333);
      // from n~95 surviving white-field elements hue-shift to dark purple
      // (flipped while the purple clone covers the layer)
      tl.set("#afield", { filter: "brightness(0.5) sepia(1) hue-rotate(215deg) saturate(2.2)" }, 3.5);
      fieldW.born.forEach(function (pair, i) {
        tl.set(pair[0], { autoAlpha: 0 }, 0.75);
        tl.set(fieldP.born[i][0], { autoAlpha: 0 }, 0.75);
        tl.set(pair[0], { autoAlpha: 1 }, births[i]);
        tl.set(fieldP.born[i][0], { autoAlpha: 1 }, births[i]);
      });
      ringSched.forEach(function (ev, i) {
        const dW = fieldW.blinkers[i], dP = fieldP.blinkers[i];
        const olW = dW.querySelector(".oline"), olP = dP.querySelector(".oline");
        ev.forEach(function (e) {
          const t = e[0], kind = e[1];
          const al = kind === "empty" ? 0 : e[2];
          // texture fills capped at ~luma 165 outside the n50-60 entry pulse
          const palW = t < 2.2 ? BLK_BG.white : BLK_BG.whiteCap;
          const bgW = (kind === "outline" || kind === "empty") ? "none" : palW[kind];
          const bgP = (kind === "outline" || kind === "empty") ? "none" : BLK_BG.purple[kind];
          tl.set(dW, { opacity: al, background: bgW }, t);
          tl.set(dP, { opacity: al, background: bgP }, t);
          tl.set(olW, { opacity: kind === "outline" ? 1 : 0 }, t);
          tl.set(olP, { opacity: kind === "outline" ? 1 : 0 }, t);
        });
      });
      // selection rect + corner squares
      tl.set(["#atitlegrp", "#atitlegrpp"], { autoAlpha: 0 }, 0.75);
      tl.set(["#aline1", "#aline2", "#aline1p", "#aline2p"], { autoAlpha: 0 }, 0.75);
      tl.to("#atitlegrp", { autoAlpha: 1, duration: 0.06, ease: "power1.out" }, 1.73);
      tl.set("#atitlegrpp", { autoAlpha: 1 }, 1.79);
      // title word-by-word (f54/f55/f56)
      tl.set("#aw1", { autoAlpha: 0 }, 0.75);
      tl.set("#aw2", { autoAlpha: 0 }, 0.75);
      tl.set(["#aw1"], { autoAlpha: 1 }, 1.8);
      tl.set(["#aw2"], { autoAlpha: 1 }, 1.8330);
      tl.set(["#aline1"], { autoAlpha: 1 }, 1.8);
      tl.set(["#aline2"], { autoAlpha: 1 }, 1.8663);
      tl.set(["#aline1p"], { autoAlpha: 1 }, 1.8);
      tl.set(["#aline2p"], { autoAlpha: 1 }, 1.8663);
      // purple phase (clone crossfade)
      tl.to("#apwrap", { opacity: 1, duration: 0.2, ease: "power1.inOut" }, 3.03);
      tl.to("#apwrap", { opacity: 0, duration: 0.17, ease: "power1.inOut" }, 3.83);
      // pill pops (position + scale driven per-frame by orbitPills())
      pillEls.forEach(function (p, i) {
        tl.set(p, { autoAlpha: 0 }, 0.75);
        tl.set(p, { autoAlpha: 1 }, PBIRTH[i]);
      });
      // pill hatch scroll
      document.querySelectorAll("#apills .hstrip > div, #bstack .hstrip > div").forEach(function (s) {
        tl.fromTo(s, { x: 0 }, { x: -44, duration: 3.6, ease: "none" }, 0.933);
      });
      // A exit: NO global fade (ref keeps title/labels full-white); ruler
      // strips retire, then a hard 2-frame black dip at n137-138 before B
      tl.to("#afurn", { autoAlpha: 0, duration: 0.18, ease: "power1.in" }, 4.35);
      tl.set("#afurn", { autoAlpha: 0 }, 4.5333);
      tl.set(["#azoom", "#apills", "#afurn"], { autoAlpha: 0 }, 4.5667);

      /* ----- ghost columns ----- */
      tl.to("#ghostinner", { opacity: 0.9, duration: 0.55, ease: "power1.inOut" }, 4.683);

      /* ----- scene B ----- */
      tl.set("#btitle", { autoAlpha: 0 }, 4.563);
      tl.set("#btitle", { autoAlpha: 1 }, 4.6333);
      tl.fromTo("#bcluster", { x: 190 }, { x: 0, duration: 0.577, ease: "power2.out" }, 4.653);
      stackEls.forEach(function (p, i) {
        tl.set(p, { autoAlpha: 0 }, 4.563);
        tl.set(p, { autoAlpha: 1 }, 4.6333 + i * 0.0333);   // ref waterfall: 1f apart
      });
      tl.to("#bcluster", { autoAlpha: 0, duration: 0.3, ease: "power1.in" }, 5.463);

      /* ----- scene C ----- */
      tl.set(["#ctab", "#cicons", "#cliverow"], { autoAlpha: 0 }, 5.433);
      tl.to("#ctab", { autoAlpha: 1, duration: 0.1 }, 5.5);
      tl.to("#cicons", { autoAlpha: 1, duration: 0.1 }, 5.533);
      tl.to("#cliverow", { autoAlpha: 1, duration: 0.14 }, 5.6);
      barEls.forEach(function (b, i) {
        tl.fromTo(b, { scaleX: 0 }, { scaleX: barInit[i], duration: 0.34, ease: "power2.out" }, 5.663 + i * 0.028);
      });
      barPales.forEach(function (p, i) {
        tl.set(p, { opacity: 1 }, 5.433);
        tl.to(p, { opacity: 0, duration: 0.42, ease: "power1.inOut" }, 5.83 + i * 0.022);
      });
      for (let t = 6.16; t < 7.32; t += 0.1333) {
        for (let j = 0; j < 5; j++) {
          const bi = Math.floor(rnd() * barEls.length);
          tl.to(barEls[bi], { scaleX: range(0.4, 1), duration: 0.09, ease: "power1.out" }, t);
        }
      }
      tl.fromTo("#cpanel", { x: 18, y: 27 }, { x: -17.5, y: -27, duration: 1.417, ease: "none" }, 5.933);

      /* ----- scene D -----
         (pin wave is driven per-frame by wavePins(); heads peek over the
         bottom edge at clip start via its entry envelope) */
      // wireframe box pops small, grows to final; hatch draws on
      tl.set("#ordergrp", { autoAlpha: 0 }, 7.35);
      tl.set(["#ow1", "#ow2"], { autoAlpha: 0 }, 7.35);
      tl.set(["#ddashL", "#ddashR"], { autoAlpha: 0 }, 7.35);
      tl.set("#ordergrp", { autoAlpha: 1 }, 7.4);
      tl.fromTo("#ordergrp", { scale: 0.7, x: -85, y: -55 }, { scale: 1, x: 0, y: 0, duration: 0.23, ease: "power2.out" }, 7.4);
      // hatch present from first box frame, contrast ramps over ~10f (measured)
      tl.set("#ohatchwrap", { opacity: 0 }, 7.35);
      tl.to("#ohatchwrap", { opacity: 1, duration: 0.33, ease: "power1.inOut" }, 7.4);
      tl.set("#ow1", { autoAlpha: 1 }, 7.5333);
      tl.set("#ow2", { autoAlpha: 1 }, 7.5663);
      // wide -> tight tracking settle via per-glyph x transforms
      oChars.forEach(function (s, i) {
        // same 21px tracking spread, symmetric about the run center
        // ((len-1)/2 == 5 for the original 11-glyph "Every order")
        const off = (i - (oChars.length - 1) / 2) * 21;
        tl.set(s, { x: off }, 7.35);
        tl.to(s, { x: 0, duration: 0.43, ease: "power2.out" }, 7.5663);
      });
      tl.set(["#ddashL", "#ddashR"], { autoAlpha: 0.85 }, 7.6);

      /* ----- D -> E ----- */
      tl.to("#ordergrp", { scale: 0.493, x: 4, y: -11, duration: 0.55, ease: "power3.out" }, 9.103);
      tl.to("#dpins", { autoAlpha: 0, duration: 0.28 }, 9.15);
      tl.set(["#mktgrp", "#astgrp"], { autoAlpha: 0 }, 7.35);
      tl.fromTo("#mktgrp", { autoAlpha: 0, x: -700, y: 600, scale: 2.6 },
        { autoAlpha: 1, x: 0, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 9.133);
      tl.fromTo("#astgrp", { autoAlpha: 0, x: 700, y: 600, scale: 2.6 },
        { autoAlpha: 1, x: 0, y: 0, scale: 1, duration: 0.55, ease: "power3.out" }, 9.18);
      tl.set("#epins", { autoAlpha: 0 }, 7.35);
      // helix already rotating during the box fly-in (ref: visible from ~9.0s)
      tl.to("#epins", { autoAlpha: 1, duration: 0.2 }, 9.0);
      ["#dl1", "#dl2", "#dl3"].forEach(function (id, i) {
        tl.set(id, { autoAlpha: 0, scaleY: 0 }, 7.35);
        tl.to(id, { autoAlpha: 0.9, scaleY: 1, duration: 0.3, ease: "power2.out" }, 10.653 + i * 0.09);
      });
      tl.to(["#deinner", "#furnDE .strip", "#deqmarks"], { autoAlpha: 0, duration: 0.13, ease: "power1.in" }, 11.193);

      /* ----- scene F ----- */
      tl.set(["#fw1", "#fw2", "#gw1", "#gw2", "#gw3"], { autoAlpha: 0 }, 11.233);
      tl.set(["#fgbl", "#fgbr"], { autoAlpha: 0 }, 11.233);
      tl.set("#ffurn", { autoAlpha: 0 }, 11.233);
      tl.set("#gfurn", { autoAlpha: 0 }, 11.233);
      tl.set("#fstem", { autoAlpha: 0 }, 11.233);
      // braces pop close together, widen to F positions (x offsets vs G-final CSS pos)
      tl.set(["#fgbl", "#fgbr"], { autoAlpha: 1 }, 11.333);
      tl.fromTo("#fgbl", { x: 380 }, { x: 50, duration: 0.34, ease: "power2.out" }, 11.333);
      tl.fromTo("#fgbr", { x: -369 }, { x: -39, duration: 0.34, ease: "power2.out" }, 11.333);
      tl.set("#fstem", { autoAlpha: 0.9 }, 11.333);
      tl.fromTo("#fstem", { scaleY: 1 }, { scaleY: 0, duration: 0.5, ease: "power2.out" }, 11.333);
      tl.set("#fstem", { autoAlpha: 0 }, 11.85);
      tl.set("#fw1", { autoAlpha: 1 }, 11.4);
      tl.set("#fw2", { autoAlpha: 1 }, 11.533);
      tl.set("#ffurn", { autoAlpha: 1 }, 11.633);

      /* ----- F -> G retype ----- */
      tl.set(["#fw1", "#fw2"], { autoAlpha: 0 }, 12.717);
      tl.to("#fgbl", { x: 0, duration: 0.233, ease: "power2.out" }, 12.717);
      tl.to("#fgbr", { x: 0, duration: 0.233, ease: "power2.out" }, 12.717);
      tl.set("#gw1", { autoAlpha: 1 }, 12.7297);
      tl.set("#gw2", { autoAlpha: 1 }, 12.7663);
      tl.set("#gw3", { autoAlpha: 1 }, 12.7997);
      tl.set("#ffurn", { autoAlpha: 0 }, 12.717);
      tl.set("#gfurn", { autoAlpha: 1 }, 12.7297);

      /* ----- scene H : glitch dissolve -----
         (scramble blob + static y=540 glow band are canvas-drawn by
         drawDissolve(); the old scanning bar is gone — ref has none) */
      tl.set("#hbox", {
        autoAlpha: 0,
        x: -23,
        y: 66
      }, 13.7);
      document.querySelectorAll("#hboxhatch .hatchline").forEach(function (ln) {
        tl.set(ln, { autoAlpha: 0 }, 13.7);
      });
      tl.set("#hbox", { autoAlpha: 1 }, 13.74);
      tl.fromTo("#hbox", { scale: 0.94 }, { scale: 1, duration: 0.12, ease: "power2.out" }, 13.74);
      // ruler strips vanish at the scramble switch: ref band rows x240-360
      // carry only the grainy glow, no static ticks (measured f416-439)
      tl.set(["#stripG2L", "#stripG2R"], { autoAlpha: 0 }, 13.7333);
      document.querySelectorAll("#hboxhatch .hatchline").forEach(function (ln, k) {
        tl.set(ln, { autoAlpha: 0.85 }, 13.77 + k * 0.04);
      });
      tl.to("#gfurn2", { autoAlpha: 0, duration: 0.12 }, 14.75);

      /* ----- scene I : wordmark + glow decay ----- */
      tl.set(["#iwordmark", "#iglow1", "#iglow2", "#iglow3", "#ifurn"], { autoAlpha: 0 }, 13.7);
      // glow legible from ~f444, saturated core by f445 (ref)
      tl.to("#iwordmark", { autoAlpha: 1, duration: 0.1, ease: "power1.inOut" }, 14.7333);
      tl.to("#iglow1", { autoAlpha: 0.95, duration: 0.1 }, 14.7333);
      tl.to("#iglow2", { autoAlpha: 1, duration: 0.1 }, 14.7667);
      tl.to("#iglow3", { autoAlpha: 0.9, duration: 0.1 }, 14.7667);
      tl.to("#iglow3", { autoAlpha: 0, duration: 0.8, ease: "power2.out" }, 14.95);
      tl.to("#iglow2", { autoAlpha: 0, duration: 0.95, ease: "power2.out" }, 14.95);
      tl.to("#iglow1", { autoAlpha: 0.28, duration: 0.95, ease: "power2.out" }, 14.95);
      // ruler strips arrive after the dissolve dust clears (ref shows no
      // bright y~540 furniture during f444-455)
      tl.to("#ifurn", { autoAlpha: 1, duration: 0.16 }, 15.3);
      // flanking dashes flash in around formation, gone by ~15.4 (ref f443-f455)
      tl.set(["#idashL", "#idashR"], { autoAlpha: 0 }, 13.7);
      tl.set(["#idashL", "#idashR"], { autoAlpha: 0.85 }, 14.7);
      tl.to(["#idashL", "#idashR"], { autoAlpha: 0, duration: 0.25 }, 15.1);

      tl.to("#hbox", { scale: 0.4, duration: 0.14, ease: "power2.in" }, 14.6);

      tl.to("#hbox", { autoAlpha: 0, duration: 0.14, ease: "power2.in" }, 14.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
