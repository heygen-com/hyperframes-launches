              <path data-hf-id="hf-06wp" d="M256.97 25.9638L232.58 38.7638C229.28 40.4938 225.98 38.5338 226.75 35.3038L234.16 4.10376C234.93 0.873757 239.16 -1.08624 241.64 0.643757L259.95 13.4438C264.12 16.3538 262.52 23.0538 256.97 25.9638Z" fill="url(#a11GradR)" />

    <script>
    (function(){
      const R = (document.currentScript && document.currentScript.closest('#act11-root')) || document.querySelector('#act11-root');
      if (!R || !window.gsap) return;
      const zoom = R.querySelector('#act11-zoom');
      const mark = R.querySelector('#act11-mark'), fill = R.querySelector('#act11-fill'),
            lock = R.querySelector('#act11-lock'), cursor = R.querySelector('#act11-cursor');
      const baseWings = [...R.querySelectorAll('#act11-mark > svg path')];
      const fillWings = [...R.querySelectorAll('#act11-fill svg path')];
      const wingL = [baseWings[0], fillWings[0]], wingR = [baseWings[1], fillWings[1]];
      const starBtn = R.querySelector('#act11-star');
      const starOff = R.querySelector('#gh-star-off'), starOn = R.querySelector('#gh-star-on');
      const labelEl = R.querySelector('#gh-label'), labelCol = R.querySelector('#gh-label-col');
      const countCol = R.querySelector('#gh-count-col');

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused:true });

      gsap.set(mark,{ scale:1, opacity:1, transformOrigin:'50% 50%' });
      gsap.set(fill,{ clipPath:'inset(100% 0 0 0)' });
      // lockup rides 62px above true center to make room for the star pill beneath
      gsap.set(lock,{ opacity:0, y:-62, clipPath:'inset(0% 0% 0% 100%)', transformOrigin:'50% 50%' });
      gsap.set([...baseWings,...fillWings],{ x:34, opacity:0 });
      gsap.set(cursor,{ x:532, y:1210 });
      gsap.set(starBtn,{ xPercent:-50, y:40, opacity:0 });
      gsap.set(starOn,{ transformOrigin:'50% 50%' });

      // ENTRY — CUT-THE-CURVE: act10's lines exit LEFT mid-motion; the wings answer
      // from the right on the same vector, over the SHARED bg pattern. The right
      // wing's snap-back is the force everything downstream rides on.
      tl.fromTo(wingL,{x:34,opacity:0.35},{x:0,opacity:1,duration:.3, ease:'power4.out',  immediateRender:false},0);
      tl.fromTo(wingR,{x:34,opacity:0.35},{x:-5.2,opacity:1,duration:.22,ease:'power3.out',immediateRender:false},0.05);
      tl.to(wingR,{x:0,duration:.18,ease:'back.out(2.5)'},0.27);

      // CURSOR CLICK 1 — rises in from off-frame bottom, presses the mark; the release
      // launches the flight. The cursor STAYS on screen — it just steps down-right and
      // parks below the pill's landing spot while the flight/lockup play out.
      tl.to(cursor,{y:574,duration:.45,ease:'power3.out'},0.25);
      tl.to(cursor,{scale:.84,duration:.08,ease:'power2.in',transformOrigin:'21% 14%'},0.67);
      tl.to(cursor,{scale:1,duration:.18,ease:'power2.out',transformOrigin:'21% 14%'},0.75);
      tl.to(mark,{y:16,scale:0.90,duration:.12,ease:'power3.out'},0.73);
      tl.to(cursor,{x:640,y:780,duration:.5,ease:'power2.inOut'},0.92);

      // F = press release: fill + flight ignite on the same frame. FD = flight time.
      const F = 0.85, FD = 0.9;
      tl.to(fill,{ clipPath:'inset(0% 0 0 0)', duration:FD, ease:'none' }, F);
      // FLY TO SLOT — square slot math: lockup 84cqw (907.2px, 3.4494 px/unit), mark
      // 45.5cqw (491.4px); lockup center is 62px above frame center: mark sub-rect
      // center (869.4, 409.0) → delta(+329.4, −131.0), landing scale 0.5194.
      const CE = window.CustomEase;
      if (CE && gsap.registerPlugin) gsap.registerPlugin(CE);
      const exX = CE ? CE.create('a11flyX','0.6,-0.28,0.85,0.62') : 'power2.inOut';
      const exY = CE ? CE.create('a11flyY','0.2,0.6,0.4,1.1')  : 'power2.out';
      const exS = CE ? CE.create('a11flyS','0.7,0.05,0.85,1')  : 'power3.in';
      tl.to(mark,{ x:329.4, duration:FD, ease:exX }, F);
      tl.to(mark,{ y:-131.0, duration:FD, ease:exY }, F);
      tl.to(mark,{ scale:1.05,   duration:.16,    ease:'back.out(2)' }, F);
      tl.to(mark,{ scale:0.5194, duration:FD-.16, ease:exS }, F+.16);
      tl.to(mark,{ keyframes:{ rotation:[0,6,0], easeEach:'sine.inOut' }, duration:FD, ease:'none' }, F);
      // IMPACT RECOIL — trailing wing compresses, snaps out past rest, rides back chill
      tl.to(wingL,{ x:3.2,  duration:.07, ease:'power3.out' }, F+FD);
      tl.to(wingL,{ x:-1.8, duration:.09, ease:'power2.out' }, F+FD+0.07);
      tl.to(wingL,{ x:0,    duration:.55, ease:'power1.inOut' }, F+FD+0.16);
      // MASK REVEAL — the wordmark sweeps open from the mark's side on the rebound frame
      tl.set(lock,{ opacity:1 }, F+FD+0.07);
      tl.to(lock,{ clipPath:'inset(0% 0% 0% 0%)', duration:.09, ease:'power2.out' }, F+FD+0.07);

      // ── STAR BEAT — the pill arrives under the lockup; the cursor returns and stars it ──
      tl.set(starBtn,{ opacity:1 }, 2.05);   // binary arrival (waterfall-entry rule)
      tl.to(starBtn,{ y:0, duration:.35, ease:'power4.out' }, 2.05);
      // cursor comes UP from its parked spot, tip onto the pill
      tl.to(cursor,{ x:517, y:685, duration:.5, ease:'power3.inOut' }, 2.2);
      // CLICK 2 (press 2.85, release 2.95) — the star lands
      tl.to(cursor,{scale:.84,duration:.08,ease:'power2.in',transformOrigin:'21% 14%'},2.85);
      tl.to(cursor,{scale:1,duration:.18,ease:'power2.out',transformOrigin:'21% 14%'},2.93);
      tl.fromTo(starBtn,{scale:1},{scale:.96,duration:.09,yoyo:true,repeat:1,
        ease:'power2.inOut',transformOrigin:'50% 50%'},2.85);
      // star fills GOLD with a pop; label Star → Starred; count 34.1k → 34.2k (odometer)
      tl.to(starOff,{ opacity:0, duration:.08 }, 2.95);
      tl.fromTo(starOn,{ opacity:0, scale:.4 },{ opacity:1, scale:1, duration:.4, ease:'back.out(2.4)' }, 2.95);
      tl.to(labelEl,{ width:104, duration:.28, ease:'power2.inOut' }, 2.98);
      tl.to(labelCol,{ y:-34, duration:.28, ease:'power3.inOut' }, 2.98);
      tl.to(countCol,{ y:-36, duration:.3, ease:'power3.inOut' }, 3.05);
      // cursor exits ALL THE WAY off the bottom of the frame (no fade);
      // hold on lockup + starred pill to comp end
      tl.to(cursor,{ y:1160, duration:.5, ease:'power2.in' }, 3.45);

      tl.to({},{ duration:4.9 }, 0);

      window.__timelines["act11"] = tl;
    })();
    </script>
