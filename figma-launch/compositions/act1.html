    <script>
      (function () {
        var tl = gsap.timeline({ paused: true });

        var card1 = "#act1-card1";
        var K = 1.5; // cold-open zoom: 38px body renders at ~57px on the square frame

        // Geometry stash — computed ONCE, at the first render of the t=0 set,
        // while card 1 is still untransformed (function-based values evaluate
        // lazily, after fonts are loaded; plain build-time measuring would race
        // the font load and land the dock off-target).
        var S = null;
        function measure() {
          var cardEl = document.getElementById("act1-card1");
          var lineEl = document.getElementById("act1-l1mask");
          var butEl  = document.getElementById("act1-but");
          var c = cardEl.getBoundingClientRect();
          var r = lineEl.getBoundingClientRect();
          var pcx = r.left + r.width / 2;
          var pcy = r.top + r.height / 2;
          S = {
            // cold pose 1: line A alone, centered at (960, 505)
            dx1: 540 - c.left - K * (pcx - c.left),
            dy1: 500 - c.top  - K * (pcy - c.top),
            // cold pose 2: after "but" joins, recenter the grown line
            butW: butEl.getBoundingClientRect().width + 9
          };
          S.dx2 = S.dx1 - (K * S.butW) / 2;
          return S;
        }

        // ── 0.0 · cold pose (black void, card chrome hidden by CSS) ──
        tl.set(card1, {
          x: function () { return (S || measure()).dx1; },
          y: function () { return S.dy1; },
          scale: K,
          transformOrigin: "0px 0px"
        }, 0);

        // ── 0.15–1.05 · "hyperframes is genuinely great" slides in R→L inside its mask ──
        tl.fromTo("#act1-l1slide", { xPercent: 105 }, { xPercent: 0, duration: 0.9, ease: "power4.out" }, 0.15);
        // breath: 1.05 → 1.8 (stillness before the turn)

        // ── 1.8–2.6 · line nudges left as "but" cascades in R→L, letter by letter ──
        tl.to(card1, { x: function () { return S.dx2; }, duration: 0.7, ease: "power2.inOut" }, 1.8);
        tl.fromTo("#act1-but .bt",
          { x: 130, autoAlpha: 0 },
          { x: 0, autoAlpha: 1, duration: 0.55, ease: "power4.out", stagger: 0.14 }, 1.85);
        // the turn lands: 2.6 → 3.5 hold

        // ── 3.5–4.2 · THE DOCK — card travels to identity; the world fades up around the line ──
        tl.to(card1, { x: 0, y: 0, scale: 1, duration: 0.7, ease: "power3.inOut" }, 3.5);
        tl.fromTo("#act1-bgwrap", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.65, ease: "power2.out" }, 3.55);
        // ground fades OUT to reveal the master-level pattern video beneath this act
        tl.to("#act1-ground", { autoAlpha: 0, duration: 0.65, ease: "power2.out" }, 3.5);
        tl.fromTo("#act1-c1glass", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.55, ease: "power2.out" }, 3.6);
        tl.fromTo("#act1-card1 .act1-head",
          { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.78);
        tl.fromTo("#act1-rest",
          { autoAlpha: 0, y: 14 },
          { autoAlpha: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.88);
        tl.fromTo("#act1-card1 .act1-meta",
          { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.05);
        tl.fromTo("#act1-card1 .act1-row",
          { autoAlpha: 0, y: 12 }, { autoAlpha: 1, y: 0, duration: 0.4, ease: "power3.out" }, 4.15);
        // ── dimensional pop, card 1 (0.1s after the dock lands @4.2) ──
        // steep cubic scale — fast, long smooth tail; rotation slower + smoother.
        // right side leans toward camera (rotationY, per-element perspective — no 3D ancestors)
        tl.set("#act1-card1", { transformPerspective: 1100, transformOrigin: "50% 50%" }, 4.29);
        tl.to("#act1-card1", { scale: 1.045, duration: 0.9, ease: "expo.out" }, 4.3);
        tl.to("#act1-card1", { rotationY: -7, rotationX: 6, duration: 1.35, ease: "power2.out" }, 4.3);
        tl.fromTo("#act1-shine1 i", { x: -320 }, { x: 1340, duration: 0.85, ease: "power2.out" }, 4.32);

        // read hold on card 1 (extended +0.5)

        // ── 5.5 · card 1 → card 2 (cut-the-curve LEFT, ZERO OVERLAP:
        //    outgoing is fully off-frame before the incoming shows) ──
        tl.to("#act1-card1", { x: -1400, duration: 0.42, ease: "power4.in" }, 6.5);
        tl.set("#act1-card1", { autoAlpha: 0 }, 6.93); // hard guarantee: gone (incl. shadow)
        tl.fromTo("#act1-card2", { x: 1400 }, { x: 0, duration: 0.5, ease: "power4.out" }, 6.94);

        // ── dimensional pop, card 2 (0.1s after it lands @6.94) ──
        tl.set("#act1-card2", { transformPerspective: 1100, transformOrigin: "50% 50%" }, 7.53);
        tl.to("#act1-card2", { scale: 1.045, duration: 0.9, ease: "expo.out" }, 7.54);
        tl.to("#act1-card2", { rotationY: -7, rotationX: 6, duration: 1.35, ease: "power2.out" }, 7.54);
        tl.fromTo("#act1-shine2 i", { x: -320 }, { x: 1340, duration: 0.85, ease: "power2.out" }, 7.56);

        // read hold on card 2 (extended +0.5)

        // ── 7.3 · card 2 → card 3, same grammar ──
        tl.to("#act1-card2", { x: -1400, duration: 0.42, ease: "power4.in" }, 9.3);
        tl.set("#act1-card2", { autoAlpha: 0 }, 9.73);
        tl.fromTo("#act1-card3", { x: 1400 }, { x: 0, duration: 0.5, ease: "power4.out" }, 9.74);

        // half-beat hold on card 3: 7.97 → 8.35

        // ── 8.35 → 9.0 · PUSH IN (Z+, reserved vector) — into card 3's body text; Act 2 picks up mid-zoom ──
        // highlight sweeps: each card's key phrase gets selected while it's on screen
        tl.fromTo("#act1-hl1", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.inOut" }, 4.6);
        // card 2: two-stage selection — "couldn't get it to" first, THEN the Figma phrase
        tl.fromTo("#act1-hl2a", { scaleX: 0 }, { scaleX: 1, duration: 0.55, ease: "power2.inOut" }, 7.7);
        tl.fromTo("#act1-hl2", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, 8.35);
