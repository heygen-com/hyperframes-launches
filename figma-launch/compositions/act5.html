  <script>
  (function(){
    const root = document.currentScript ? document.currentScript.closest('#act5-root') : null;
    const R = root || document.querySelector('#act5-root');
    if (!R || !window.gsap) return;

    const SEG1 = "Use /figma to rebuild these frames ";
    const LINK = "figma.com/xK9…";
    const SEG2 = " and then invoke the /product-launch-video to make a launch video for our new feature";
    const PLEN = SEG1.length + LINK.length + SEG2.length;
    const typed  = R.querySelector('.typed');
    const tlink  = R.querySelector('.tlink');
    const t2     = R.querySelector('.t2');
    const caret  = R.querySelector('.caret');
    const ub     = R.querySelector('.usermsg .ub');
    const usermsg= R.querySelector('.usermsg');
    const agent  = R.querySelector('.agent');
    const lines  = R.querySelectorAll('.reply .rl:not(.closer)');
    const composer = R.querySelector('.composer');
    const cursor   = R.querySelector('.cursor');
    const ret      = R.querySelector('.ret');
    const win = R.querySelector('.win');
    const bar = R.querySelector('.bar');

    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });

    // ── BIG CENTERED PROMPT BOX (sfx-music-launch terminal grammar, 1080² remap) ──
    // window starts FULL-BLEED; composer floats big + centered; after the cursor taps ↵
    // the box morphs down into its docked spot while the window shrinks to floating size.
    gsap.set(win, { xPercent:-50, yPercent:-50, width:1080, height:1080, borderRadius:0,
      boxShadow:'0 3cqw 9cqw -3cqw rgba(0,0,0,0)' });
    gsap.set(bar, { opacity:0 });
    gsap.set(composer, { right:'auto', width:690, left:195, bottom:360,
      scale:1.4, transformOrigin:'50% 100%' });

    // entry: composer elements cut in from the right (the film's leftward current)
    const chipsEl = R.querySelector('.chips'), inputEl = R.querySelector('.inputbar'),
          metaEl  = R.querySelector('.metarow');
    tl.fromTo(inputEl, {x:280, opacity:0}, {x:0, opacity:1, duration:.55, ease:'power3.out'}, 0.02);
    tl.fromTo(chipsEl, {x:340, opacity:0}, {x:0, opacity:1, duration:.55, ease:'power3.out'}, 0.10);
    tl.fromTo(metaEl,  {x:340, opacity:0}, {x:0, opacity:1, duration:.55, ease:'power3.out'}, 0.16);

    gsap.set(R.querySelector('.orb'),{transformOrigin:'50% 50%'});
    tl.to(R.querySelector('.orb'),{rotation:360,duration:1.0,ease:'none',repeat:6},0);

    gsap.set(caret,{opacity:1});
    tl.to(caret,{opacity:0,duration:.5,ease:"steps(1)",repeat:9,yoyo:true}, 0.6);

    // type the prompt across three styled segments (textContent reveal — render-safe)
    const obj = { n:0 };
    tl.to(obj, {
      n: PLEN, duration: 2.45, ease:"none",
      onUpdate(){
        const n = Math.round(obj.n);
        typed.textContent = SEG1.slice(0, Math.min(n, SEG1.length));
        tlink.textContent = LINK.slice(0, Math.max(0, Math.min(n - SEG1.length, LINK.length)));
        t2.textContent    = SEG2.slice(0, Math.max(0, n - SEG1.length - LINK.length));
      }
    }, 0.7);

    // cursor rises straight up the y-axis to the ↵ send key as typing finishes
    tl.fromTo(cursor, {x:907, y:1210, opacity:0},
      {y:610, opacity:1, duration:.85, ease:'power3.out'}, 2.55);
    tl.to(cursor,{scale:.84, duration:.1, ease:'power2.in',  transformOrigin:'21% 14%'}, 3.42);
    tl.to(cursor,{scale:1,   duration:.2, ease:'power2.out', transformOrigin:'21% 14%'}, 3.52);
    tl.fromTo(ret,{color:'#6F6E66'},{color:'#D97757', duration:.08, ease:'power1.in'}, 3.5);
    tl.to(ret,{color:'#6F6E66', duration:.25}, 3.7);

    // SEND @3.6: text flies up as the user message; composer clears
    tl.add(()=>{ ub.innerHTML = SEG1 + '<span class="ulink">' + LINK + '</span>' + SEG2; }, 3.55);
    tl.set(caret,{opacity:0}, 3.6);
    tl.fromTo(usermsg,{opacity:0,y:18},{opacity:1,y:0,duration:.4,ease:"power3.out"}, 3.6);
    tl.add(()=>{ typed.textContent = ""; tlink.textContent = ""; t2.textContent = ""; }, 3.65);

    // MORPH @3.65: box settles down + wide into its docked spot; window shrinks with it.
    // visual width interpolates monotonically 966 → 874.8 (docked = 972 − 2×48.6)
    const morph = { p:0 };
    tl.to(morph, { p:1, duration:.7, ease:'power2.inOut', onUpdate(){
      const p = morph.p;
      const s = 1.4 - 0.4*p;               // scale 1.4 → 1
      const vw = 966 - 91.2*p;             // visual width 966 → 874.8
      const w = vw / s;
      const W = 1080 - 108*p;              // window width 1080 → 972
      composer.style.width = w + 'px';
      composer.style.left = (W/2 - w/2) + 'px';
      composer.style.bottom = (360 - 311.4*p) + 'px';   // 360 → 48.6 (4.5cqw dock)
      composer.style.transform = 'scale(' + s + ')';
    }}, 3.65);
    tl.to(win, { width:972, height:885.6, borderRadius:25.9,
      boxShadow:'0 3cqw 9cqw -3cqw rgba(0,0,0,.6)', duration:.7, ease:'power2.inOut' }, 3.65);
    tl.fromTo(bar, {opacity:0, x:-14}, {opacity:1, x:0, duration:.35, ease:'power2.out'}, 3.95);
    tl.to(cursor, { y:691, opacity:0, duration:.35, ease:'power2.in' }, 3.7);

    // thinking @4.0
    tl.fromTo(agent,{opacity:0},{opacity:1,duration:.3}, 4.0);
    tl.fromTo(R.querySelector('.think'),{opacity:0},{opacity:1,duration:.3}, 4.0);
    tl.fromTo(R.querySelector('.ast'),{rotation:0},{rotation:360,duration:1.0,ease:"none"}, 4.0);

    // the confident (wrong) reply, line by line @4.9
    lines.forEach((p,i)=>{
      tl.fromTo(p,{opacity:0,y:14},{opacity:1,y:0,duration:.45,ease:"power3.out"}, 4.85 + i*0.42);
    });

    // the closer lands alone after a beat of stillness
    tl.fromTo(R.querySelector('.rl.closer'),{opacity:0,y:14},
      {opacity:1,y:0,duration:.45,ease:"power3.out"}, 6.95);

    // EXIT: ZOOM-THROUGH (Z push) — the window accelerates toward camera and is fully
    // gone at the cut; the output card (master level) picks up growing, already playing.
    // Zero overlap: autoAlpha 0 lands before the card's data-start (25.95 master).
    tl.to(win, { scale:1.22, duration:.35, ease:'power3.in', transformOrigin:'50% 50%' }, 7.6);
    tl.to(win, { opacity:.15, duration:.35, ease:'none' }, 7.6);
    tl.set(win, { autoAlpha:0 }, 7.95);

    // pad the timeline to the full clip window (visibility follows timeline duration)
    tl.to({},{duration:17.95}, 0);

    window.__timelines["act5"] = tl;
  })();
  </script>
