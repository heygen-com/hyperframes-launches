    <script>
      (function () {
        // clone the three hero cards into the echo layers (bg + cardpos), so every
        // echo is literally the same tweet, just re-cropped
        document.querySelectorAll("#act2-root .act2-echo").forEach(function (echo) {
          var src = document.getElementById("act2-" + echo.getAttribute("data-clone"));
          echo.innerHTML = src.innerHTML;
        });

        var tl = gsap.timeline({ paused: true });

        // [layer, targetSel, zoom, start, end]
        // ONE-WAY ZOOM LADDER: zoom strictly increases across every cut — the camera
        // only ever moves closer. Cadence accelerates: .8 / .5 / .4 / .3 / .2 / .15 / .12 / .1.
        // First three cuts key on the full highlight (whole phrase in frame, widest
        // phrase first); the rest re-crop the same three cards on the stem, tighter each time.
        var cuts = [
          ["#act2-f3", ".act2-hl", 1.32, 0.00, 0.80],
          ["#act2-f2", ".act2-hl", 1.60, 0.80, 1.30],
          ["#act2-f1", ".act2-hl", 1.95, 1.30, 1.70],
          ["#act2-e1", ".stem",    2.30, 1.70, 2.00],
          ["#act2-e2", ".stem",    2.70, 2.00, 2.20],
          ["#act2-e3", ".stem",    3.10, 2.20, 2.35],
          ["#act2-e4", ".stem",    3.50, 2.35, 2.47],
          ["#act2-e5", ".stem",    3.95, 2.47, 2.57],
          ["#act2-e6", ".stem",    4.40, 2.57, 2.90]
        ];

        cuts.forEach(function (c, i) {
          var layer = c[0], targetSel = c[1], Z = c[2], t0 = c[3], t1 = c[4];
          var st = null;
          // measured zoom pose: highlight (or stem) center lands on frame center.
          // function-based values → evaluated after fonts load, before the pose applies.
          tl.set(layer + " .act2-cardpos", {
            x: function () {
              var pos = document.querySelector(layer + " .act2-cardpos").getBoundingClientRect();
              var t = document.querySelector(layer + " " + targetSel).getBoundingClientRect();
              // desired: highlight center at frame center — but clamp so the visible
              // window (1920/Z × 1080/Z) never leaves the card (no exposed card edge)
              function clamp(v, lo, hi) { return hi < lo ? (lo + hi) / 2 : Math.min(hi, Math.max(lo, v)); }
              var wx = 540 / Z, wy = 540 / Z;
              var cx = clamp(t.left + t.width / 2 - pos.left, wx, pos.width - wx);
              var cy = clamp(t.top + t.height / 2 - pos.top,  wy, pos.height - wy);
              st = { dx: 540 - pos.left - Z * cx,
                     dy: 540 - pos.top  - Z * cy };
              return st.dx;
            },
            y: function () { return st.dy; },
            scale: Z,
            transformOrigin: "0px 0px"
          }, 0);

          // hard cuts, zero overlap
          tl.set(layer, { autoAlpha: 1 }, t0);
          if (i < cuts.length - 1) tl.set(layer, { autoAlpha: 0 }, t1);

          // continuous Z+ drift while visible (origin = frame center = the highlight,
          // so the centered phrase holds still as the world pushes)
          if (i === 0) {
            // INVERSE ZOOM-THROUGH entry: arrives from large, decelerating — matches
            // card 3's receding exit (d(scale)/dt negative on both sides of the cut)
            tl.fromTo(layer, { scale: 1.5 }, { scale: 1.04, duration: t1 - t0, ease: "expo.out",
              transformOrigin: "50% 50%", immediateRender: false }, t0);
          } else {
            tl.fromTo(layer, { scale: 1.0 }, { scale: 1.04, duration: t1 - t0, ease: "none",
              transformOrigin: "50% 50%" }, t0);
          }
        });

        // ── exit: last flash cuts-the-curve LEFTWARD into Act 3's "Until now" ──
        // (fully off-frame by 2.9; Act 3's text enters mid-flight on the same vector)
        tl.to("#act2-e6", { x: -1250, duration: 0.3, ease: "power4.in" }, 2.6);

        window.__timelines = window.__timelines || {};
        window.__timelines["act2"] = tl;
      })();
    </script>
