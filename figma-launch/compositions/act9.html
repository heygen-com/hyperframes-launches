  <script>
  (function(){
    const root = document.currentScript ? document.currentScript.closest('#act9-root') : null;
    const R = root || document.querySelector('#act9-root');
    if (!R || !window.gsap) return;

    const SEG1 = "Use /figma to grab the Motion animation on our outro frame ";
    const LINK = "figma.com/xK9…?node-id=12-4";
    const SEG2 = " and add it to the end of the video";
    const PLEN = SEG1.length + LINK.length + SEG2.length;
    const t1 = R.querySelector('.t1'), tlink = R.querySelector('.tlink'), t2 = R.querySelector('.t2');
    const caret = R.querySelector('.caret');
    const ub = R.querySelector('.usermsg .ub');
    const usermsg = R.querySelector('.usermsg');
    const cursor = R.querySelector('.cursor');
    const ret = R.querySelector('.ret');
    const win = R.querySelector('.win');

    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused:true });

    // window enters on the leftward current, mid-flight (answers "Even motion works." exiting left)
    tl.fromTo(win, { x: 1250 }, { x: 0, duration: 0.55, ease: "power4.out" }, 0);
    tl.fromTo("#act9-shade", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4, ease: "power2.out" }, 0);

    gsap.set(R.querySelector('.orb'),{transformOrigin:'50% 50%'});
    tl.to(R.querySelector('.orb'),{rotation:360,duration:1.0,ease:'none',repeat:4},0);
    gsap.set(caret,{opacity:1});
    tl.to(caret,{opacity:0,duration:.5,ease:"steps(1)",repeat:7,yoyo:true}, 0.4);

    // type the motion prompt across the three styled segments
    const obj = { n:0 };
    tl.to(obj, {
      n: PLEN, duration: 2.4, ease:"none",
      onUpdate(){
        const n = Math.round(obj.n);
        t1.textContent    = SEG1.slice(0, Math.min(n, SEG1.length));
        tlink.textContent = LINK.slice(0, Math.max(0, Math.min(n - SEG1.length, LINK.length)));
        t2.textContent    = SEG2.slice(0, Math.max(0, n - SEG1.length - LINK.length));
      }
    }, 0.65);

    // cursor rises to ↵, taps
    tl.fromTo(cursor, {x:880, y:1210, opacity:0},
      {y:800, opacity:1, duration:.8, ease:'power3.out'}, 2.6);
    tl.to(cursor,{scale:.84, duration:.1, ease:'power2.in',  transformOrigin:'21% 14%'}, 3.5);
    tl.to(cursor,{scale:1,   duration:.2, ease:'power2.out', transformOrigin:'21% 14%'}, 3.6);
    tl.fromTo(ret,{color:'#6F6E66'},{color:'#D97757', duration:.08, ease:'power1.in'}, 3.58);
    tl.to(ret,{color:'#6F6E66', duration:.25}, 3.78);

    // send: message flies up; composer clears; thinking starts
    tl.add(()=>{ ub.innerHTML = SEG1 + '<span class="ulink">' + LINK + '</span>' + SEG2; }, 3.65);
    tl.set(caret,{opacity:0}, 3.7);
    tl.fromTo(usermsg,{opacity:0,y:18},{opacity:1,y:0,duration:.4,ease:"power3.out"}, 3.7);
    tl.add(()=>{ t1.textContent=""; tlink.textContent=""; t2.textContent=""; }, 3.75);
    tl.to(cursor, { y:880, opacity:0, duration:.35, ease:'power2.in' }, 3.75);
    tl.fromTo(R.querySelector('.think'),{opacity:0},{opacity:1,duration:.3}, 4.1);
    tl.fromTo(R.querySelector('.ast'),{rotation:0},{rotation:360,duration:1.0,ease:"none"}, 4.1);

    // Claude RESPONDS before the output is shown
    tl.to(R.querySelector('.think'),{autoAlpha:0,duration:.25}, 5.0);
    tl.fromTo(R.querySelector('.agent2'),{opacity:0,y:14},{opacity:1,y:0,duration:.45,ease:"power3.out"}, 5.1);

    // EXIT: ZOOM-THROUGH (Z push) — window accelerates toward camera, fully gone at the
    // cut; the tail card (master level) picks up growing, ALREADY PLAYING. Zero overlap:
    // autoAlpha 0 lands at the cut, tail data-start = 52.95 master (local 6.8).
    tl.to(win, { scale:1.22, duration:.35, ease:'power3.in', transformOrigin:'50% 50%' }, 6.45);
    tl.to(win, { opacity:.15, duration:.35, ease:'none' }, 6.45);
    tl.set(win, { autoAlpha:0 }, 6.8);

    // layer holds (shade grounds the tail card) to comp end
    tl.to({},{duration:9.7}, 0);

    window.__timelines["act9"] = tl;
  })();
  </script>
